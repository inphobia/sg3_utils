# See also https://docs.github.com/en/actions/learn-github-actions/expressions
# See also https://github.com/marketplace/actions/setup-android-ndk

name: build_win_artifact

on: workflow_dispatch

jobs:
  build_and_save:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
        - linux-mingw64-gcc
        include:
        - build: linux-mingw64-gcc
          cc: gcc
          host: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu packages
        run: |
          sudo apt-get -q update
          sudo apt-get -q install -y binutils-mingw-w64 gcc-mingw-w64
      - name: Build
        run: |
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32 --enable-win32-spt-direct  --enable-static --enable-shared=no
          make
      - name: artifact save
        uses: actions/upload-artifact@v4
        with:
          name: kitchensink
          path: ~/**
      - name: artifact save
        uses: actions/upload-artifact@v4
        with:
          name: binaries_only
          path: scripts/*exe
